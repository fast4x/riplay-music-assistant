[project]
name = "riplay-music-assistant"
version = "0.1.0"
description = "RiPlay music provider for Music Assistant: the local RiPlay library over the RiPlay bridge API."
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
# tooling only: the provider itself is loaded by the Music Assistant server from
# its folder and installs its runtime requirements (manifest.json) on its own
dev = [
  "aiohttp>=3.9.0",
  "music-assistant-models>=2.0.0",
  "pytest>=9.0.0",
  "pytest-asyncio>=1.0.0",
  "ruff>=0.14.0",
]

[tool.uv]
# the provider is loaded by the server from its folder, never installed as a package
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.format]
line-ending = "lf"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "ASYNC", "RUF"]
ignore = [
  "E501", # long lines are handled by the formatter
]
